      <div class="auth-wrapper">
        <div class="auth-title-block">
          <h1 class="auth-title">Вход</h1>
          <p class="auth-subtitle">
            Чтобы воспользоваться системой, пожалуйста, заполните поля ниже
          </p>
        </div>

        <form id="login-form" class="auth-form" novalidate>
          <div class="field">
            <label for="email">Почта</label>
            <div class="input-shell">
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="username"
                placeholder="example@gmail.com"
                required
              />
            </div>
          </div>

          <div class="field">
            <label for="password">Пароль</label>
            <div class="input-shell">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="********"
                required
              />
              <button
                type="button"
                class="password-toggle"
                data-password-toggle
                data-target="password"
                aria-label="Показать пароль"
              >
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path
                    d="M2.989 11.4823C4.47186 12.9565 7.05794 14.9999 10.0002 14.9999C12.9424 14.9999 15.528 12.9565 17.0108 11.4823C17.4019 11.0936 17.5981 10.8985 17.7226 10.5168C17.8115 10.2444 17.8115 9.75561 17.7226 9.48325C17.5981 9.10151 17.4019 8.90642 17.0108 8.51759C15.5279 7.0434 12.9424 5 10.0002 5C7.05794 5 4.47186 7.0434 2.989 8.51759C2.59761 8.90669 2.4019 9.10137 2.27733 9.48325C2.18848 9.75561 2.18848 10.2444 2.27733 10.5168C2.40191 10.8986 2.59761 11.0932 2.989 11.4823Z"
                    stroke="currentColor"
                    stroke-width="1.25"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M8.33333 10C8.33333 10.9205 9.07953 11.6667 10 11.6667C10.9205 11.6667 11.6667 10.9205 11.6667 10C11.6667 9.07953 10.9205 8.33333 10 8.33333C9.07953 8.33333 8.33333 9.07953 8.33333 10Z"
                    stroke="currentColor"
                    stroke-width="1.25"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
          </div>

          <p id="auth-message" class="auth-message" aria-live="polite"></p>
        </form>
      </div>

      <div class="auth-actions">
        <button class="btn-primary" type="submit" form="login-form">Войти</button>
        <p class="auth-footer">
          <span>Нет аккаунта?</span>
          <a href="/register">Зарегистрироваться</a>
        </p>
      </div>
    </main>

    <script src="/static/js/auth.js"></script>

</html>
