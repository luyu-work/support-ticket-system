<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мои тикеты — Support Ticket System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/auth.css" />
    <link rel="stylesheet" href="/static/css/tickets.css" />
  </head>
  <body data-page="my-tickets">
    <div class="client-shell">
      <header class="client-profile-card">
        <div class="client-profile">
          <div class="client-avatar" id="profile-avatar" aria-hidden="true">А</div>
          <div class="client-profile-text">
            <div class="client-profile-name" id="profile-full-name">…</div>
            <div class="client-profile-role">Клиент</div>
          </div>
        </div>
        <button
          id="logout-button"
          class="icon-button"
          type="button"
          aria-label="Выйти"
          title="Выйти"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path
              d="M8.00001 6.00008L10 8.00008L8.00001 10.0001M10 8.00008H2.66667M6.00001 4.83247V4.80021C6.00001 4.05347 6.00001 3.67983 6.14533 3.39461C6.27316 3.14373 6.47699 2.9399 6.72787 2.81207C7.01309 2.66675 7.38673 2.66675 8.13347 2.66675H11.2001C11.9469 2.66675 12.3197 2.66675 12.6049 2.81207C12.8558 2.9399 13.0603 3.14373 13.1882 3.39461C13.3333 3.67955 13.3333 4.05274 13.3333 4.79802V11.2025C13.3333 11.9477 13.3333 12.3204 13.1882 12.6053C13.0603 12.8562 12.8558 13.0604 12.6049 13.1882C12.32 13.3334 11.9473 13.3334 11.2021 13.3334H8.13128C7.386 13.3334 7.01281 13.3334 6.72787 13.1882C6.47699 13.0604 6.27316 12.856 6.14533 12.6051C6.00001 12.3199 6.00001 11.9468 6.00001 11.2001V11.1667"
              stroke="#333333"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </header>

      <section class="client-main-card">
        <div class="client-main-title">
          <h1>Мои тикеты</h1>
          <a href="/tickets/new" class="btn-feedback">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M4 8H8M8 8H12M8 8V12M8 8V4" stroke="#F1F5FF" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>Обратная связь</span>
          </a>
        </div>

        <div id="my-tickets-list" class="client-ticket-list">
          <p class="muted-text">Загрузка…</p>
        </div>
      </section>
    </div>

    <div id="ticket-modal" class="ticket-modal" hidden>
      <div class="ticket-modal-backdrop" data-close-modal></div>
      <div class="ticket-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="ticket-modal-title">
        <div class="ticket-modal-header">
          <h2 id="ticket-modal-title">Тикет</h2>
          <button type="button" class="icon-button" data-close-modal aria-label="Закрыть">×</button>
        </div>
        <div class="ticket-modal-body">
          <p class="muted-text">
            Модальное окно-заглушка. Макет детального просмотра появится позже.
          </p>
          <p id="ticket-modal-summary" class="ticket-modal-summary"></p>
        </div>
      </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/tickets.js"></script>
  </body>
</html>
