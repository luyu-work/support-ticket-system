services:
  postgres:
    image: postgres:16-alpine
    container_name: ticket_system_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticket_admin
      POSTGRES_PASSWORD: ticket_secret_change_me
      POSTGRES_DB: ticket_system
    ports:
      - "5432:5432"
    volumes:
      - ticket_system_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_admin -d ticket_system"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket_system_api
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      DATABASE_URL_OVERRIDE: ""
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ticket_admin
      POSTGRES_PASSWORD: ticket_secret_change_me
      POSTGRES_DATABASE: ticket_system
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ticket_system_postgres_data:
